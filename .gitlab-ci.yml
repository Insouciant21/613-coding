stages:
  - unit-test
  - lint
  - typecheck
  - demo
  - container
  - artifact-smoke

default:
  image: python:3.12.8-slim-bookworm
  before_script:
    - pip install --no-cache-dir uv==0.8.14
    - uv sync --frozen

unit-test:
  stage: unit-test
  script:
    - uv run pytest -q

lint:
  stage: lint
  script:
    - uv run ruff check .

typecheck:
  stage: typecheck
  script:
    - uv run mypy src

demo:
  stage: demo
  script:
    - uv run pytest tests/demo -q

docker-build:
  stage: container
  image: docker:27.5.1-cli
  before_script: []
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --pull --target artifacts --output type=local,dest=dist .
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

artifact-smoke:
  stage: artifact-smoke
  needs:
    - job: docker-build
      artifacts: true
  script:
    - scripts/smoke_artifacts.sh dist
