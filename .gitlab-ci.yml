stages:
  - unit-test
  - lint
  - typecheck
  - demo
  - build
  - container

default:
  image: python:3.12.8-slim-bookworm
  before_script:
    - pip install --no-cache-dir uv==0.8.14
    - uv sync --frozen

unit-test:
  stage: unit-test
  script:
    - uv run pytest -q

lint:
  stage: lint
  script:
    - uv run ruff check .

typecheck:
  stage: typecheck
  script:
    - uv run mypy src

demo:
  stage: demo
  script:
    - uv run python -m coding_harness.demo.core_feedback --help || true
    - uv run pytest tests/demo -q

build:
  stage: build
  script:
    - uv build
  artifacts:
    paths:
      - dist/

docker-build:
  stage: container
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --pull -t 613-coding:"$CI_COMMIT_SHA" .
