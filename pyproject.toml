[build-system]
requires = ["uv_build>=0.8.0,<1"]
build-backend = "uv_build"

[project]
name = "coding-harness"
version = "0.1.0"
description = "613 Coding local coding agent harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "httpx>=0.28,<1",
    "lancedb>=0.20,<1",
    "keyring>=25,<26",
    "typer>=0.15,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
