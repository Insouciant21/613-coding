[build-system]
requires = ["uv_build>=0.8.0,<1"]
build-backend = "uv_build"

[project]
name = "613-coding"
version = "0.1.0"
description = "613 Coding local coding agent harness"
requires-python = ">=3.12"
scripts = { 613-coding = "coding613.cli.entrypoint:main" }
dependencies = [
    "pydantic>=2.11,<3",
    "httpx>=0.28,<1",
    "lancedb>=0.20,<1",
    "keyring>=25,<26",
    "typer>=0.15,<1",
    "dulwich>=0.24,<1",
    "jsonschema>=4.25,<5",
    "unidiff>=0.7.5,<1",
    "textual>=3.7,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "types-jsonschema>=4.25,<5",
    "pytest-asyncio>=0.25,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "coding613"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
