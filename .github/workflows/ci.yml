name: 613 Coding CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - run: uv sync --frozen
      - run: uv run pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - run: uv sync --frozen
      - run: uv run pytest tests/demo -q

  package-and-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - run: uv sync --frozen
      - run: docker build --pull --target artifacts --output type=local,dest=dist .
      - run: scripts/smoke_artifacts.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: 613-coding-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package-and-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 613-coding-${{ github.sha }}
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/613-coding-linux-x86_64
            dist/613_coding-*.whl
            dist/613_coding-*.tar.gz
            dist/SHA256SUMS
