name: 613 Coding CI

on:
  push:
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - run: uv sync --frozen
      - run: uv run pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - run: uv sync --frozen
      - run: uv run pytest tests/demo -q

  package-and-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - run: uv sync --frozen
      - run: docker build --pull --target artifacts --output type=local,dest=dist .
      - run: scripts/smoke_artifacts.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: 613-coding-${{ github.sha }}
          path: dist/
          if-no-files-found: error
